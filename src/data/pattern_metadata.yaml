  signal_typical: 매도
  svg: |
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
      <polyline points="10,20 40,25 70,30 100,36 130,42 160,48 190,55" fill="none" stroke="#ff7f0e" stroke-width="2"/>
      <polyline points="10,35 40,40 70,45 100,50 130,55 160,60 190,65" fill="none" stroke="#2ca02c" stroke-width="2"/>
      <polyline points="10,60 40,64 70,67 100,70 130,73 160,77 190,80" fill="none" stroke="#1f77b4" stroke-width="2"/>
      <text x="14" y="18" font-size="8" fill="#ff7f0e">단기</text>
      <text x="14" y="33" font-size="8" fill="#2ca02c">중기</text>
      <text x="14" y="78" font-size="8" fill="#1f77b4">장기 (하향)</text>
    </svg>
  description_html: |
    <p><strong>형성:</strong> 단기 < 중기 < 장기 순으로 SMA 배치되고 장기선이 하향. Cross 없는 약세.</p>
    <p><strong>신호:</strong> 매도 — 안정적 하락 추세. 데드크로스만큼 강하진 않지만 반등 약함.</p>
    <p><strong>검출:</strong> last_short < last_mid AND 장기선 기울기 < -임계값 (cross 시그널 없음).</p>

"추세 미확정":
  signal_typical: 관망
  svg: |
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
      <polyline points="10,55 30,40 50,65 70,45 90,60 110,50 130,55 150,42 170,58 190,48" fill="none" stroke="#999" stroke-width="2"/>
      <text x="60" y="92" font-size="9" fill="#666">횡보 / 혼재</text>
    </svg>
  description_html: |
    <p><strong>형성:</strong> 이동평균선이 서로 얽혀 명확한 추세가 없음 (cross 없음 + 기울기 약함).</p>
    <p><strong>신호:</strong> 관망 — 방향성 부족. 거래량/RSI 등 다른 지표로 보완 필요.</p>
